components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: |
        会话令牌 lts_…（由长期凭据换取或由人登录得到，限定范围与有效期）。长期凭据 ltk_…
        只能换会话，不能直接调用业务接口；浏览器会话令牌只能经 Cookie 使用。Bearer 请求
        不做 CSRF 检查，但仍须通过正常授权。见 docs/contracts/identity.md。
    cookieSession:
      type: apiKey
      in: cookie
      name: lantai_session
      description: |
        网页的 HttpOnly/Secure/SameSite=Strict 会话。GET/HEAD/OPTIONS 以外的请求必须带与
        允许列表精确相同的 Origin（缺失即拒绝）并在 X-CSRF-Token 头中带与该会话相符的 CSRF
        令牌；同一请求不能同时带 Bearer 与会话 Cookie。
  schemas:
    PartResult:
      type: object
      additionalProperties: false
      required: [part_number, duplicate, received_parts, part_count]
      properties:
        part_number:
          type: integer
          minimum: 1
        duplicate:
          description: 该分片此前已以相同内容写入，本次没有再写。
          type: boolean
        received_parts:
          description: 该内容已收到的分片数。
          type: integer
          minimum: 0
        part_count:
          type: integer
          minimum: 1
    AssetDescriptionView:
      additionalProperties: false
      properties:
        asset_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        asset_type:
          type: string
        defaults:
          additionalProperties: true
          type: object
        extra:
          additionalProperties: true
          type: object
        project_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        revision:
          minimum: 0
          type: integer
        sensitivity:
          type: string
        slug:
          type: string
        subjects:
          items:
            type: string
          type: array
        summary:
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        updated_by:
          type: string
      required:
        - asset_id
        - project_id
        - asset_type
        - slug
        - title
        - tags
        - subjects
        - sensitivity
        - revision
        - updated_by
      type: object
    AssetPatch:
      additionalProperties: false
      description: sensitivity/defaults are recognized but rejected by the ordinary metadata command with FIELD_REQUIRES_SPECIAL_COMMAND.
      properties:
        defaults:
          additionalProperties: true
          type: object
        extra:
          additionalProperties: true
          type: object
        sensitivity:
          type: string
        subjects:
          items:
            type: string
          type: array
        summary:
          type: string
        tags:
          items:
            type: string
          type: array
        title:
          type: string
      type: object
    AssetView:
      additionalProperties: false
      properties:
        asset_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        asset_type:
          type: string
        description:
          $ref: '#/components/schemas/AssetDescriptionView'
        latest:
          $ref: '#/components/schemas/VersionView'
        project_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
