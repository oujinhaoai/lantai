  parameters:
    GrantID:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
    GrantSignature:
      name: sig
      in: query
      required: true
      description: 服务端签发的签名（只作纵深防御，授权以服务端记录为准）。
      schema:
        type: string
        maxLength: 128
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键，作用域为 (身份, 项目, 命令类型)。同键同摘要返回原结果或进行中的
        202；同键不同摘要 409 IDEMPOTENCY_CONFLICT。新的业务意图必须使用新键。
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/idempotency_key'
    RequestID:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求编号，仅用于日志关联，不参与请求摘要。
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 条件写入的预期 ETag；缺少必需的基线时返回 428 PRECONDITION_REQUIRED。
      schema:
        type: string
        maxLength: 128
  headers:
    RequestID:
      description: 服务端请求编号。
      schema:
        type: string
    RetryAfter:
      description: 建议的最短等待秒数（与错误体 retry_after_ms 一致）。
      schema:
        type: integer
        minimum: 0
  responses:
    FileContent:
      description: 文件内容（Range 请求为 206 与 Content-Range）；ETag 为 "sha256:<哈希>"
      headers:
        ETag:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Error:
      description: 结构化错误；错误码、HTTP 状态、retryable 与 recovery_action 以错误码注册表为准。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '../schemas/common/v1/error.schema.json'
    Accepted:
      description: 操作已持久接受但仍在进行；按 status_url 查询，不要换键重试。
      headers:
        Location:
          description: 与 status_url 相同。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../schemas/common/v1/operation.schema.json#/$defs/accepted'
