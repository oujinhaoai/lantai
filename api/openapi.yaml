openapi: 3.1.0
info:
  title: Lantai API
  version: 1.0.0-draft
  summary: 兰台 M2 REST 与传输契约
  description: |
    兰台只有一套 REST 接口。HTTP 路由、请求和视图由本文件定义，共享数据、清单与错误引用 schemas/ 权威定义。scripts/gen/openapi 打包为 api/gen/openapi.bundle.json；内部 handler 使用相同契约。

    /api/v1 仅加不改；持久业务创建、提交、著录和敏感命令执行要求 Idempotency-Key。会话/挑战/短时授权签发以及绑定既有上传的续传、完成、取消依各路由语义重试。著录修改要求带 If-Match。所有服务端时间为固定 UTC 毫秒。默认 JSON 上限 8 MiB，超限返回 SCHEMA_INVALID（request_body_too_large）；错误码的 HTTP 状态由统一注册表决定。
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
servers:
  - url: /
    description: 经网关同源访问；接口面前缀 /api/，传输面前缀 /xfer/（地址由服务端给出）
security:
  - bearerSession: []
  - cookieSession: []
tags:
  - name: extensions
    description: T09 扩展包静态导入、启用诊断、受限探测与本机命令投影；启停经人审授权
  - name: operations
    description: 持久操作状态查询
  - name: transfer
    description: |
      传输面：上传分片与授权下载。地址由服务端在上传会话（parts_url）与读取授权（url）
      中给出，客户端不自行拼接；每个请求仍须带本人的会话凭据，并按服务端认定的档位
      （交互/批量）排队准入。见 docs/contracts/storage.md。
paths:
  /api/v1/operations/{operation_id}:
    get:
      tags: [operations]
      operationId: getOperation
      summary: 查询持久操作状态
      description: |
        返回操作阶段、结果引用、是否可重试与下一步建议。结果引用按调用者
        当前读取权限过滤；无权知道的操作返回 404，不泄露存在性。
      parameters:
        - $ref: '#/components/parameters/OperationID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 操作状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '../schemas/common/v1/operation.schema.json'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /xfer/v1/uploads/{upload_id}/files/{sha256}/parts/{part}:
    put:
      tags: [transfer]
      operationId: putUploadPart
      summary: 写入上传分片
      description: |
        把分片字节流式写入上传会话的暂存区并核验。长度须与会话布局一致，
        Lantai-Part-Sha256 为本分片字节的 SHA-256。同一分片同内容重复写入是幂等的
        （duplicate=true）；已记录的分片换内容一律 422 HASH_MISMATCH（part_conflict），
        原分片不变。每次请求都复核当前上传权限与会话状态。
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
        - name: sha256
          in: path
          required: true
          description: 会话申报的内容哈希。
          schema:
            $ref: '../schemas/common/v1/defs.schema.json#/$defs/sha256_hex'
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Lantai-Part-Sha256
          in: header
          required: true
          schema:
            $ref: '../schemas/common/v1/defs.schema.json#/$defs/sha256_hex'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 分片已写入并核验（或是重复的同内容分片）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '507':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /xfer/v1/reads/{grant_id}:
    get:
      tags: [transfer]
      operationId: readGrantedFile
      summary: 按读取授权下载文件（支持 Range）
      description: |
        读取授权绑定主体与本人会话、版本、文件、哈希与用途。每个新的 GET/Range
        请求都复核签名、会话、撤销与到期，并在最终读取检查内按当前权限、台账已提交
        状态与用途限制判定。转发给别人的地址、另一个会话或只知道哈希都不能取件
        （404，不泄露存在性）；撤权后的新请求立即拒绝，不等签名到期。
      parameters:
        - $ref: '#/components/parameters/GrantID'
        - $ref: '#/components/parameters/GrantSignature'
        - name: Range
          in: header
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/FileContent'
        '206':
          $ref: '#/components/responses/FileContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '416':
          description: 请求的范围不可满足
        default:
          $ref: '#/components/responses/Error'
    head:
      tags: [transfer]
      operationId: headGrantedFile
      summary: 读取授权文件的元信息
      parameters:
        - $ref: '#/components/parameters/GrantID'
        - $ref: '#/components/parameters/GrantSignature'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 与 GET 相同的响应头，没有响应体
        default:
          description: 与 GET 相同的错误状态（HEAD 没有响应体）
  /api/v1/assets:
    get:
      operationId: searchAssets
      parameters:
        - in: query
          name: view
          required: false
          schema:
            default: brief
            enum:
              - brief
              - full
            type: string
        - in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: project_id
          required: false
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        - in: query
          name: asset_type
          required: false
          schema:
            $ref: ../schemas/catalog/v1/manifest.schema.json#/$defs/asset_type
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryPage'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: searchAssets
  /api/v1/assets/{asset_id}:
    get:
      operationId: getAsset
      parameters:
        - in: query
          name: view
          required: false
          schema:
            default: brief
            enum:
              - brief
              - full
            type: string
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: asset_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: getAsset
  /api/v1/assets/{asset_id}/metadata:
    patch:
      description: If-Match is required and must be a quoted nonnegative revision, e.g. "0". Success returns the new revision in ETag.
      operationId: patchAssetMetadata
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: asset_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPatch'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDescriptionView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: patchAssetMetadata
  /api/v1/assets/{asset_id}/versions/{version_id}:
    get:
      description: Authority-backed exact read. Full includes the frozen manifest; brief omits it.
      operationId: getVersion
      parameters:
        - in: query
          name: view
          required: false
          schema:
            default: brief
            enum:
              - brief
              - full
            type: string
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: asset_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        - in: path
          name: version_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExactVersionView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: getVersion
  /api/v1/assets/{asset_id}/versions/{version_id}/read-grants:
    post:
      description: Creates a fresh short-lived session-bound capability. It is not a persisted business command and does not require Idempotency-Key. Follow returned url with the same session; every new GET/Range is authorized again.
      operationId: issueReadGrant
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: asset_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        - in: path
          name: version_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadGrantRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadGrant'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: issueReadGrant
  /api/v1/identity/challenges:
    post:
      description: Creates an expiring challenge, or rechallenges the same immutable operation. Display the server summary and targets before asking the person for a code.
      operationId: createIdentityChallenge
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensitiveRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: createIdentityChallenge
  /api/v1/identity/challenges/{challenge_id}/verify:
    post:
      operationId: verifyIdentityChallenge
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: challenge_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanGrant'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: verifyIdentityChallenge
  /api/v1/identity/commands:
    post:
      operationId: executeIdentityCommand
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensitiveRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveResult'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: executeIdentityCommand
  /api/v1/identity/factor/confirm:
    post:
      operationId: confirmFactor
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: confirmFactor
  /api/v1/identity/factor/enroll:
    post:
      operationId: enrollFactor
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: enrollFactor
  /api/v1/identity/password:
    put:
      operationId: setSetupPassword
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
      responses:
        "204":
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: setSetupPassword
  /api/v1/identity/principals/{principal_id}:
    get:
      operationId: getPrincipal
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: principal_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: getPrincipal
  /api/v1/identity/projects/{project_id}/members:
    get:
      operationId: getProjectMembers
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: project_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: getProjectMembers
  /api/v1/meta:
    get:
      operationId: getMeta
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: getMeta
  /api/v1/projects:
    get:
      operationId: listProjects
      parameters:
        - in: query
          name: view
          required: false
          schema:
            default: brief
            enum:
              - brief
              - full
            type: string
        - in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: listProjects
    post:
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: createProject
  /api/v1/projects/{key}:
    get:
      operationId: getProject
      parameters:
        - in: query
          name: view
          required: false
          schema:
            default: brief
            enum:
              - brief
              - full
            type: string
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: key
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: getProject
  /api/v1/sessions/current:
    delete:
      operationId: endCurrentSession
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "204":
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: endCurrentSession
  /api/v1/sessions/exchange:
    post:
      operationId: exchangeSession
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: exchangeSession
  /api/v1/sessions/login:
    post:
      description: Human password plus current authenticator code. Browser channel requires an exact configured Origin and refuses cross-site Fetch metadata. Source rate limit uses the direct peer, never an untrusted forwarding header.
      operationId: loginSession
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: loginSession
  /api/v1/sessions/setup:
    post:
      operationId: startSetup
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      security: []
      summary: startSetup
  /api/v1/types:
    get:
      operationId: listTypes
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypePage'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: listTypes
  /api/v1/types/{type}:
    get:
      operationId: getAssetType
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: type
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeDetail'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: getAssetType
  /api/v1/uploads:
    post:
      description: Persistently fixes operation_id. Use each file part_url_template, substituting only {part_number}; do not construct transfer routes.
      operationId: createUpload
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: createUpload
  /api/v1/uploads/{upload_id}:
    delete:
      description: Cancel the existing upload/commit operation through catalog. The existing upload identity is the retry key; no new business intent is created.
      operationId: cancelUpload
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: upload_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      responses:
        "204":
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: cancelUpload
    get:
      operationId: getUpload
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: upload_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadView'
          description: 成功
        default:
          $ref: '#/components/responses/Error'
      summary: getUpload
  /api/v1/uploads/{upload_id}/check:
    post:
      operationId: checkUploadBlobs
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - in: path
          name: upload_id
          required: true
          schema:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckBlobsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobStatusPage'
