openapi: 3.1.0
info:
  title: Lantai API
  version: 1.0.0-draft
  summary: 兰台 HTTP 契约（公共部分）
  description: |
    兰台只有一套 REST 接口，CLI、MCP、SDK 与网页都经它访问。本文件维护
    HTTP 层的公共约定：认证方式、幂等键、请求编号、错误模型、202 响应与
    操作查询。数据结构引用 schemas/ 中的权威 JSON Schema，不在这里复制；
    scripts/gen/openapi 将其打包为自包含文档 api/gen/openapi.bundle.json。

    约定：/api/v1 内只加不改；写请求必须带 Idempotency-Key；著录修改带
    If-Match；时间为 UTC 毫秒。业务端点由各模块在实现时按此约定加入。
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
servers:
  - url: /
    description: 经网关同源访问；接口面前缀 /api/，传输面前缀 /xfer/（地址由服务端给出）
security:
  - bearerSession: []
  - cookieSession: []
tags:
  - name: operations
    description: 持久操作状态查询
  - name: transfer
    description: |
      传输面：上传分片与授权下载。地址由服务端在上传会话（parts_url）与读取授权（url）
      中给出，客户端不自行拼接；每个请求仍须带本人的会话凭据，并按服务端认定的档位
      （交互/批量）排队准入。见 docs/contracts/storage.md。
paths:
  /api/v1/operations/{operation_id}:
    get:
      tags: [operations]
      operationId: getOperation
      summary: 查询持久操作状态
      description: |
        返回操作阶段、结果引用、是否可重试与下一步建议。结果引用按调用者
        当前读取权限过滤；无权知道的操作返回 404，不泄露存在性。
      parameters:
        - $ref: '#/components/parameters/OperationID'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 操作状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '../schemas/common/v1/operation.schema.json'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /xfer/v1/uploads/{upload_id}/files/{sha256}/parts/{part}:
    put:
      tags: [transfer]
      operationId: putUploadPart
      summary: 写入上传分片
      description: |
        把分片字节流式写入上传会话的暂存区并核验。长度须与会话布局一致，
        Lantai-Part-Sha256 为本分片字节的 SHA-256。同一分片同内容重复写入是幂等的
        （duplicate=true）；已记录的分片换内容一律 422 HASH_MISMATCH（part_conflict），
        原分片不变。每次请求都复核当前上传权限与会话状态。
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
        - name: sha256
          in: path
          required: true
          description: 会话申报的内容哈希。
          schema:
            $ref: '../schemas/common/v1/defs.schema.json#/$defs/sha256_hex'
        - name: part
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Lantai-Part-Sha256
          in: header
          required: true
          schema:
            $ref: '../schemas/common/v1/defs.schema.json#/$defs/sha256_hex'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 分片已写入并核验（或是重复的同内容分片）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '507':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /xfer/v1/reads/{grant_id}:
    get:
      tags: [transfer]
      operationId: readGrantedFile
      summary: 按读取授权下载文件（支持 Range）
      description: |
        读取授权绑定主体与本人会话、版本、文件、哈希与用途。每个新的 GET/Range
        请求都复核签名、会话、撤销与到期，并在最终读取检查内按当前权限、台账已提交
        状态与用途限制判定。转发给别人的地址、另一个会话或只知道哈希都不能取件
        （404，不泄露存在性）；撤权后的新请求立即拒绝，不等签名到期。
      parameters:
        - $ref: '#/components/parameters/GrantID'
        - $ref: '#/components/parameters/GrantSignature'
        - name: Range
          in: header
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          $ref: '#/components/responses/FileContent'
        '206':
          $ref: '#/components/responses/FileContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '416':
          description: 请求的范围不可满足
        default:
          $ref: '#/components/responses/Error'
    head:
      tags: [transfer]
      operationId: headGrantedFile
      summary: 读取授权文件的元信息
      parameters:
        - $ref: '#/components/parameters/GrantID'
        - $ref: '#/components/parameters/GrantSignature'
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: 与 GET 相同的响应头，没有响应体
        default:
          description: 与 GET 相同的错误状态（HEAD 没有响应体）
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: |
        会话令牌 lts_…（由长期凭据换取或由人登录得到，限定范围与有效期）。长期凭据 ltk_…
        只能换会话，不能直接调用业务接口；浏览器会话令牌只能经 Cookie 使用。Bearer 请求
        不做 CSRF 检查，但仍须通过正常授权。见 docs/contracts/identity.md。
    cookieSession:
      type: apiKey
      in: cookie
      name: lantai_session
      description: |
        网页的 HttpOnly/Secure/SameSite=Strict 会话。GET/HEAD/OPTIONS 以外的请求必须带与
        允许列表精确相同的 Origin（缺失即拒绝）并在 X-CSRF-Token 头中带与该会话相符的 CSRF
        令牌；同一请求不能同时带 Bearer 与会话 Cookie。
  schemas:
    PartResult:
      type: object
      additionalProperties: false
      required: [part_number, duplicate, received_parts, part_count]
      properties:
        part_number:
          type: integer
          minimum: 1
        duplicate:
          description: 该分片此前已以相同内容写入，本次没有再写。
          type: boolean
        received_parts:
          description: 该内容已收到的分片数。
          type: integer
          minimum: 0
        part_count:
          type: integer
          minimum: 1
  parameters:
    GrantID:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
    GrantSignature:
      name: sig
      in: query
      required: true
      description: 服务端签发的签名（只作纵深防御，授权以服务端记录为准）。
      schema:
        type: string
        maxLength: 128
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键，作用域为 (身份, 项目, 命令类型)。同键同摘要返回原结果或进行中的
        202；同键不同摘要 409 IDEMPOTENCY_CONFLICT。新的业务意图必须使用新键。
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/idempotency_key'
    RequestID:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求编号，仅用于日志关联，不参与请求摘要。
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 条件写入的预期 ETag；缺少必需的基线时返回 428 PRECONDITION_REQUIRED。
      schema:
        type: string
        maxLength: 128
  headers:
    RequestID:
      description: 服务端请求编号。
      schema:
        type: string
    RetryAfter:
      description: 建议的最短等待秒数（与错误体 retry_after_ms 一致）。
      schema:
        type: integer
        minimum: 0
  responses:
    FileContent:
      description: 文件内容（Range 请求为 206 与 Content-Range）；ETag 为 "sha256:<哈希>"
      headers:
        ETag:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Error:
      description: 结构化错误；错误码、HTTP 状态、retryable 与 recovery_action 以错误码注册表为准。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '../schemas/common/v1/error.schema.json'
    Accepted:
      description: 操作已持久接受但仍在进行；按 status_url 查询，不要换键重试。
      headers:
        Location:
          description: 与 status_url 相同。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../schemas/common/v1/operation.schema.json#/$defs/accepted'
