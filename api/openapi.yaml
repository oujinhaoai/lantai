        - principal_id
        - principal_kind
        - session_kind
        - channel
        - scopes
        - created_at
        - expires_at
      type: object
    SessionRequest:
      additionalProperties: false
      description: exchange requires token; login requires name/password/code; allowed channels are checked by identity. Credentials are never logged.
      properties:
        channel:
          enum:
            - cli
            - api
            - browser
          type: string
        code:
          type: string
          writeOnly: true
        model:
          type: string
        name:
          type: string
        password:
          type: string
          writeOnly: true
        projects:
          items:
            $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
          type: array
        purpose:
          type: string
        scopes:
          items:
            type: string
          type: array
        token:
          type: string
        ttl_seconds:
          maximum: 86400
          minimum: 0
          type: integer
      type: object
    SessionResponse:
      additionalProperties: false
      description: Browser sessions use a Secure HttpOnly SameSite=Strict cookie; no token is included. CSRF token is returned separately.
      properties:
        csrf_token:
          type: string
        session:
          $ref: '#/components/schemas/SessionInfo'
        token:
          type: string
      required:
        - session
      type: object
    SetupRequest:
      additionalProperties: false
      properties:
        channel:
          enum:
            - cli
            - browser
          type: string
        code:
          type: string
          writeOnly: true
        name:
          type: string
      required:
        - name
        - code
      type: object
    TypeDetail:
      additionalProperties: false
      properties:
        asset_type:
          type: string
        schema:
          additionalProperties: true
          type: object
        schema_pointer:
          type: string
        type_schema:
          type: string
      required:
        - asset_type
        - type_schema
        - schema_pointer
        - schema
      type: object
    TypeEntry:
      additionalProperties: false
      properties:
        asset_type:
          type: string
        metadata_fields:
          items:
            type: string
          type: array
        type_schema:
          type: string
      required:
        - asset_type
        - type_schema
        - metadata_fields
      type: object
    TypePage:
      additionalProperties: false
      properties:
        file_roles:
          items:
            type: string
          type: array
        items:
          items:
            $ref: '#/components/schemas/TypeEntry'
          type: array
        project_types:
          items:
            type: string
          type: array
        relations:
          items:
            type: string
          type: array
      required:
        - items
        - file_roles
        - relations
        - project_types
      type: object
    UploadFileView:
      additionalProperties: false
      properties:
        part_count:
          minimum: 1
          type: integer
        part_size:
          minimum: 1
          type: integer
        part_url_template:
          type: string
        received_parts:
          items:
            minimum: 1
            type: integer
          type: array
        sha256:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/sha256_hex
        size:
          minimum: 0
          type: integer
        state:
          type: string
      required:
        - sha256
        - size
        - part_size
        - part_count
        - state
        - received_parts
        - part_url_template
      type: object
    UploadView:
      additionalProperties: false
      properties:
        close_reason:
          type: string
        created_at:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/timestamp
        expires_at:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/timestamp
        files:
          items:
            $ref: '#/components/schemas/UploadFileView'
          type: array
        idle_expires_at:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/timestamp
        operation_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        parts_url:
          type: string
        principal_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        project_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        state:
          type: string
        total_bytes:
          minimum: 0
          type: integer
        upload_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
      required:
        - upload_id
        - operation_id
        - project_id
        - principal_id
        - state
        - files
        - total_bytes
        - created_at
        - idle_expires_at
        - expires_at
        - parts_url
      type: object
    VersionView:
      additionalProperties: false
      properties:
        asset_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        committed_at:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/timestamp
        manifest_digest:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/digest
        operation_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        project_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        ref:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/permanent_ref
        uri:
          type: string
        version_id:
          $ref: ../schemas/common/v1/defs.schema.json#/$defs/ulid
        version_number:
          minimum: 1
          type: integer
      required:
        - operation_id
        - project_id
        - asset_id
        - version_id
        - version_number
        - manifest_digest
        - committed_at
        - ref
        - uri
      type: object
  parameters:
    GrantID:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
    GrantSignature:
      name: sig
      in: query
      required: true
      description: 服务端签发的签名（只作纵深防御，授权以服务端记录为准）。
      schema:
        type: string
        maxLength: 128
    OperationID:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/ulid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        幂等键，作用域为 (身份, 项目, 命令类型)。同键同摘要返回原结果或进行中的
        202；同键不同摘要 409 IDEMPOTENCY_CONFLICT。新的业务意图必须使用新键。
      schema:
        $ref: '../schemas/common/v1/defs.schema.json#/$defs/idempotency_key'
    RequestID:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求编号，仅用于日志关联，不参与请求摘要。
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 条件写入的预期 ETag；缺少必需的基线时返回 428 PRECONDITION_REQUIRED。
      schema:
        type: string
        maxLength: 128
  headers:
    RequestID:
      description: 服务端请求编号。
      schema:
        type: string
    RetryAfter:
      description: 建议的最短等待秒数（与错误体 retry_after_ms 一致）。
      schema:
        type: integer
        minimum: 0
  responses:
    FileContent:
      description: 文件内容（Range 请求为 206 与 Content-Range）；ETag 为 "sha256:<哈希>"
      headers:
        ETag:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Error:
      description: 结构化错误；错误码、HTTP 状态、retryable 与 recovery_action 以错误码注册表为准。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '../schemas/common/v1/error.schema.json'
    Accepted:
      description: 操作已持久接受但仍在进行；按 status_url 查询，不要换键重试。
      headers:
        Location:
          description: 与 status_url 相同。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../schemas/common/v1/operation.schema.json#/$defs/accepted'
