name: release-artifacts

on:
  pull_request:
    paths:
      - .github/workflows/release-artifacts.yml
      - scripts/build-release.py
      - scripts/release_bundle.py
      - scripts/release_upgrade.py
      - scripts/release_backup.py
      - scripts/test-release-backup.py
      - scripts/tests/test_release_backup.py
      - scripts/test-release-delivery.py
      - scripts/test-release-browser.cjs
      - scripts/tests/test_release_bundle.py
      - scripts/tests/test_release_upgrade.py
      - scripts/tests/test_delivery_bind_guard.py
      - scripts/tests/test_build_release.py
      - scripts/test-compose-first-start.py
      - scripts/tests/test_compose_first_start.py
      - deploy/**
  workflow_dispatch:
    inputs:
      commit:
        description: Exact final main commit (40 hex characters; successful main CI required)
        required: true
        type: string
      version:
        description: Maintainer-selected version, for example v0.1.0-rc.1
        required: true
        type: string
      baseline_run:
        description: Original release artifact run for the direct retained-volume upgrade
        required: true
        default: '38394530667'
        type: string
      baseline_artifact:
        description: Exact original release artifact name
        required: true
        default: lantai-v0.1.0-rc.4-linux-amd64-d005b2ddc9911547365d7a5925cb59a8511efdbb
        type: string
      baseline_commit:
        description: Exact original release source commit
        required: true
        default: d005b2ddc9911547365d7a5925cb59a8511efdbb
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-artifacts-${{ github.event_name }}-${{ github.ref }}-${{ inputs.commit }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  caddy-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reproduce dropped file capability and verify the minimal capability
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          image = 'caddy:2.11.4'
          subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', image], check=True)
          info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image], text=True))[0]
          assert (info['Os'], info['Architecture']) == ('linux', 'amd64')
          prefix = ['docker', 'run', '--rm', '--network', 'none', '--read-only', '--cap-drop', 'ALL']
          def run(extra, command):
              return subprocess.run(prefix + extra + ['--entrypoint', '/bin/sh', image, '-ec', command], text=True, capture_output=True)
          caps = run([], 'getcap /usr/bin/caddy')
          assert caps.returncode == 0 and caps.stdout.strip() == '/usr/bin/caddy cap_net_bind_service=ep', (caps.returncode, caps.stdout, caps.stderr)
          denied = run([], 'caddy version')
          assert denied.returncode == 126 and 'Operation not permitted' in denied.stderr, (denied.returncode, denied.stdout, denied.stderr)
          allowed = run(['--cap-add', 'NET_BIND_SERVICE'], 'command -v wget >/dev/null; caddy version')
          assert allowed.returncode == 0 and allowed.stdout.startswith('v2.11.4 '), (allowed.returncode, allowed.stdout, allowed.stderr)
          result = {'image_id': info['Id'], 'repository_digests': info['RepoDigests'], 'platform': 'linux/amd64',
                    'file_capabilities': caps.stdout.strip(), 'dropped_all': {'exit_code': denied.returncode, 'stderr': denied.stderr},
                    'minimal_capability': {'exit_code': allowed.returncode, 'stdout': allowed.stdout, 'stderr': allowed.stderr},
                    'network': 'none', 'read_only': True, 'cap_drop': ['ALL'], 'cap_add': ['NET_BIND_SERVICE'], 'nas_started': False}
          pathlib.Path('caddy-image-smoke.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-image-smoke-${{ github.run_id }}
          path: caddy-image-smoke.json
          if-no-files-found: error
          retention-days: 30
  linux-amd64:
    # PR packages are synthetic candidates with no main gate or publication.
    # Manual release packages still require the exact successful main CI.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: release-source/go.mod
          cache-dependency-path: release-source/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release-source/web/package-lock.json
      - name: Install the locked browser for artifact acceptance
        run: |
          npm ci --prefix release-source/web
          npm exec --prefix release-source/web -- playwright install --with-deps chromium
      - name: Download original release artifacts (no production state)
        env:
          BASE_RUN: ${{ inputs.baseline_run || '38394530667' }}
          BASE_ARTIFACT: ${{ inputs.baseline_artifact || 'lantai-v0.1.0-rc.4-linux-amd64-d005b2ddc9911547365d7a5925cb59a8511efdbb' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$BASE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT" --dir "$RUNNER_TEMP/lantai-upgrade-baseline"
      - name: Build immutable local image archives and packages
        env:
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || inputs.commit }}
          RELEASE_VERSION: ${{ github.event_name == 'pull_request' && format('v0.0.0-pr.{0}', github.event.number) || inputs.version }}
          BASE_COMMIT: ${{ inputs.baseline_commit || 'd005b2ddc9911547365d7a5925cb59a8511efdbb' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUT: ${{ runner.temp }}/lantai-release-${{ github.run_id }}
        run: |
          gate=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then gate=(--require-main-ci); fi
          python3 release-control/scripts/build-release.py \
            --source release-source --commit "$RELEASE_COMMIT" \
            --version "$RELEASE_VERSION" --out "$RELEASE_OUT" \
            --upgrade-from-dir "$RUNNER_TEMP/lantai-upgrade-baseline" \
            --upgrade-from-commit "$BASE_COMMIT" "${gate[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lantai-${{ github.event_name == 'pull_request' && format('v0.0.0-pr.{0}', github.event.number) || inputs.version }}-linux-amd64-${{ github.event.pull_request.head.sha || inputs.commit }}
          path: ${{ runner.temp }}/lantai-release-${{ github.run_id }}/deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve nonsecret acceptance failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delivery-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lantai-release-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/lantai-release-${{ github.run_id }}/deliverables/first-start-lifecycle.json
            ${{ runner.temp }}/lantai-release-${{ github.run_id }}/deliverables/delivery-image-smoke.json
            ${{ runner.temp }}/lantai-release-${{ github.run_id }}/deliverables/backup-preparation.json
            ${{ runner.temp }}/lantai-release-${{ github.run_id }}/deliverables/delivery-browser-screenshots.tar.gz
          if-no-files-found: ignore
