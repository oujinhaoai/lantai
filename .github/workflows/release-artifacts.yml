name: rc3-upgrade-verification

on:
  workflow_dispatch:
    inputs:
      old_run:
        required: true
        type: string
      new_run:
        required: true
        type: string
      old_artifact:
        required: true
        type: string
      new_artifact:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  synthetic-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify released rc2 to rc3 to rc2 with synthetic data
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_RUN: ${{ inputs.old_run }}
          NEW_RUN: ${{ inputs.new_run }}
          OLD_ARTIFACT: ${{ inputs.old_artifact }}
          NEW_ARTIFACT: ${{ inputs.new_artifact }}
        run: |
          python3 scripts/verify-rc3-upgrade.py \
            --old-run "$OLD_RUN" --new-run "$NEW_RUN" \
            --old-artifact "$OLD_ARTIFACT" --new-artifact "$NEW_ARTIFACT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rc3-upgrade-evidence-${{ github.run_id }}
          path: upgrade-evidence/
          if-no-files-found: error
          retention-days: 30
