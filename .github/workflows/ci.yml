# 持续集成：格式与静态检查、生成物无漂移、三平台测试与 SQLite 能力报告、交叉编译。
# 交叉编译通过只证明能产出二进制；平台文件语义、恢复与隔离需要各自的验收记录。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: checks (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/tools/go.sum
      - name: Real Compose first-start smoke (synthetic data and TLS only)
        run: python3 scripts/test-compose-first-start.py --evidence-file first-start-lifecycle.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Setup page sensitive-state regression
        run: node scripts/test-first-start-ui.cjs
      - name: Web install and build
        run: |
          if [ -f ../docs/user-guide/build.py ]; then python3 ../docs/user-guide/build.py --check; fi
          npm ci && npm run lint && npm run build
        working-directory: web
      - name: Web test browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: web
      - name: Web real-instance responsive acceptance
        env:
          LANTAI_WEB_CHROMIUM_EXECUTABLE: /opt/google/chrome/chrome
        run: |
          sudo apt-get install --no-install-recommends -y libnss3-tools
          python3 scripts/test-web-strict.py --evidence-file strict-web-ci.json
      - name: scripts/check.sh
        run: scripts/check.sh
      - name: govulncheck
        run: go tool -modfile=scripts/tools/go.mod govulncheck ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: web-browser-results
          path: |
            web/test-results/
            first-start-lifecycle.json
            strict-web-ci.json
          if-no-files-found: ignore

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, timeout: 20m }
          - { os: macos-latest, timeout: 20m }
          - { os: windows-latest, timeout: 30m }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Windows filesystem prerequisites
        if: runner.os == 'Windows'
        run: go test -count=1 -run 'TestWindows|TestPinned|TestAssistantCLIInspect|TestAssistantWorkerPolicy|TestRecoveryPackageRoundTrip|TestExclusiveConcurrent|TestManagementInfo|TestReferencePinned|TestWorksetRootAndDescendant' ./cmd/lantai ./internal/client ./internal/localassistant ./internal/operations ./internal/platform/fsutil
      - name: go test
        # Windows 托管 runner 的真实实例矩阵可超过 20 分钟累计执行；
        # 按平台限制整个测试包，不修改用例断言或性能验收阈值。
        run: go test -timeout=${{ matrix.timeout }} -count=1 ./...
      - name: sqlite capability report
        shell: bash
        run: |
          mkdir -p probe-work
          go run ./scripts/probe/sqlite -dir probe-work -stress 30s > sqlite-report-${{ runner.os }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sqlite-report-${{ runner.os }}
          path: sqlite-report-${{ runner.os }}.json
          if-no-files-found: ignore

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/lantai
