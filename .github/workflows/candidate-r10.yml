name: r10-candidate-artifacts

on:
  push:
    branches: [candidate/r10-artifacts-20261020]

permissions:
  contents: read
  actions: read

concurrency:
  group: r10-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact frozen product source
        working-directory: source
        run: python3 packaging/r10/verify_source.py --out "$RUNNER_TEMP/r10-source-proof.json"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/web/package-lock.json
      - name: Prepare the locked browser for the existing synthetic artifact checks
        run: |
          npm ci --prefix source/web
          npm exec --prefix source/web -- playwright install --with-deps chromium
      - name: Probe the preinstalled browser sandbox and native profile CA manager
        run: python3 source/packaging/r10/build_candidate.py --browser-preflight --out "$RUNNER_TEMP/r10-browser-preflight.json"
      - name: Download existing non-production baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38677996246 --repo "$GITHUB_REPOSITORY" --name lantai-v0.1.0-rc.5-linux-amd64-d27a06fe0af55e205a19e8f95f0764167e217741 --dir "$RUNNER_TEMP/lantai-upgrade-baseline"
      - name: Build with the existing artifact-only release script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 source/packaging/r10/build_candidate.py --source source --commit "$GITHUB_SHA" --version v0.1.0-r10-candidate --out "$RUNNER_TEMP/r10-release" --upgrade-from-dir "$RUNNER_TEMP/lantai-upgrade-baseline" --upgrade-from-commit d27a06fe0af55e205a19e8f95f0764167e217741
      - name: Stage only credential-free installation artifacts and GUI guidance
        run: |
          python3 source/packaging/r10/stage_artifact.py --build "$RUNNER_TEMP/r10-release/deliverables" --proof "$RUNNER_TEMP/r10-source-proof.json" --out "$RUNNER_TEMP/r10-candidate-artifact"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lantai-r10-candidate-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/r10-candidate-artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Require complete acceptance after preserving the candidate
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'r10-candidate-artifact/manifest.json').read_text())
          assert result['fully_accepted'], 'Acceptance failed; downloadable candidate is explicitly marked incomplete. See browser, upgrade and cleanup results.'
          PY
      - name: Preserve a credential-free failure marker
        if: failure()
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          pathlib.Path(root, 'r10-build-failed.json').write_text(json.dumps({'status':'failed','source_commit':os.environ['CANDIDATE_SHA'],'no_runtime_state_or_screenshots_attached':True})+'\n')
          summary=root/'r10-release/delivery-failure-summary.json'
          if summary.is_file():
              value=json.loads(summary.read_text())
              print('DELIVERY_FAILURE_SUMMARY '+json.dumps(value, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: r10-candidate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r10-build-failed.json
          if-no-files-found: ignore
          retention-days: 7
