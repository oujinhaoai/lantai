contract: lantai.config/v1
instance:
  name: library
secrets:
  dir: /var/lib/lantai-secrets
storage:
  min_free_bytes: 5368709120
listen:
  # 仅容器私有网络；compose 不将这两个端口发布到宿主机。
  api: 0.0.0.0:8080
  transfer: 0.0.0.0:8081
  operations: 127.0.0.1:9090
  merged: false
http:
  max_json_bytes: 8388608
  api_timeout_seconds: 30
  allowed_origins:
    - https://library.example
