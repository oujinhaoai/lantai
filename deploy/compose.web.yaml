# 可选网页覆盖层：LANTAI_WEB_DIR 指向经核验的发行静态包目录。
# 从仓库根运行 docker compose -f deploy/compose.yaml -f deploy/compose.web.yaml ...
# 只为网关添加只读静态文件；数据、密钥和首次设置卷沿用原 Compose 配置。
services:
  gateway:
    volumes:
      - type: bind
        source: ${LANTAI_WEB_DIR:?set the verified static web directory}
        target: /srv/lantai-web
        read_only: true
        bind:
          create_host_path: false
